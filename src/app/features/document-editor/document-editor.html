<div class="h-screen flex flex-col bg-gray-50">
    <!-- Toolbar -->
    <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 flex-shrink-0">
        <div class="flex items-center gap-4">
            <button (click)="goBack()" class="p-2 hover:bg-gray-100 rounded-lg text-gray-500">
                ⬅ Back
            </button>
            <div class="h-6 w-px bg-gray-300"></div>
            <div>
                <h1 class="text-lg font-bold text-gray-900">{{ id ? 'Edit Document' : 'New Document' }}</h1>
                <p class="text-xs text-gray-500" *ngIf="id">ID: {{ id }}</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div class="flex bg-gray-100 p-1 rounded-lg">
                <button (click)="toggleMode()" [class.bg-white]="mode === 'edit'" [class.shadow-sm]="mode === 'edit'"
                    class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-700 transition-all">
                    Editor
                </button>
                <button (click)="toggleMode()" [class.bg-white]="mode === 'preview'"
                    [class.shadow-sm]="mode === 'preview'"
                    class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-700 transition-all">
                    Preview
                </button>
            </div>
            <button
                class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 shadow-sm">
                Save Changes
            </button>
        </div>
    </header>

    <!-- Editor Container -->
    <div class="flex-1 overflow-hidden relative">
        <div #formContainer class="w-full h-full bg-white"></div>
    </div>
</div>
